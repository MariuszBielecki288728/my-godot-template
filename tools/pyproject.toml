[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "godot-devtools"
version = "0.1.0"
description = "Development tooling for the Godot engineering starter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdtoolkit==4.5.0",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[project.scripts]
godot-dev = "godot_devtools.cli:main"

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
